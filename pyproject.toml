[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2i-eval"
version = "0.1.0"
description = "Compact text-to-image evaluation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "diffusers>=0.30.0",
    "accelerate>=0.33.0",
    "open-clip-torch>=2.24.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.2",
    "tqdm>=4.66.0",
    "openai>=1.40.0",
    "requests>=2.32.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
