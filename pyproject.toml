[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2i-eval"
version = "0.1.0"
description = "Offline T2I benchmark for PromptCraft"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "diffusers>=0.30.0",
    "accelerate>=0.33.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.2",
    "openai>=1.40.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
